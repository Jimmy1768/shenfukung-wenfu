# ops/nginx/shengfukung-wenfu-staging.conf
#
# Staging vhost, separate from ops/nginx/shengfukung-wenfu.conf
# (production). Mirrors its shape, pointed at the staging Puma upstream
# (port 4002, matching config/puma.rb's `when "staging"` case and
# ops/env/template.temple-staging.env) and the staging checkout's own
# asset paths, not production's.
#
# Two things this file assumes but cannot itself arrange -- neither is
# a repo change, both are host/DNS actions for whoever deploys this:
# - DNS: staging.shengfukung.com.tw does not currently resolve (checked
#   directly, no A/CNAME record exists yet). Needs one before this
#   vhost can actually be reached.
# - TLS: reuses the same certificate path as production, the way
#   Combatives-Rails' own staging.sourcecombatives.com vhost does --
#   which only works if that certificate is either a wildcard
#   (*.shengfukung.com.tw) or gets re-issued to add
#   staging.shengfukung.com.tw as an additional name. Not verified
#   which is true today; confirm before relying on this file as-is.

upstream rails_puma_staging {
  server 127.0.0.1:4002 fail_timeout=0;
}

server {
  listen 80;
  server_name staging.shengfukung.com.tw;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name staging.shengfukung.com.tw;

  ssl_certificate /etc/letsencrypt/live/shengfukung.com.tw/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/shengfukung.com.tw/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  root /var/www/shengfukung-wenfu-staging;

  location /.well-known/ { try_files $uri $uri/ =404; }
  location ^~ /frontend/assets/ { try_files $uri $uri/ =404; }

  location ^~ /backend/assets/ {
    alias /home/jimmy1768_user/Projects/shengfukung-wenfu-staging/rails/public/backend/assets/;
    try_files $uri =404;
  }

  location ^~ /assets/ {
    alias /home/jimmy1768_user/Projects/shengfukung-wenfu-staging/rails/public/backend/assets/;
    try_files $uri =404;
  }

  location ^~ /marketing/admin {
    proxy_pass http://rails_puma_staging;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /admin {
    proxy_pass http://rails_puma_staging;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /internal {
    proxy_pass http://rails_puma_staging;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /account {
    proxy_pass http://rails_puma_staging;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /dev {
    proxy_pass http://rails_puma_staging;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /auth {
    proxy_pass http://rails_puma_staging;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api {
    proxy_pass http://rails_puma_staging;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / { try_files $uri $uri/ /index.html; }
}
