schema: shengfukung_wenfu_codex_work_mode:v1
scope: builder_governance_only
source_map:
  authority: AGENTS.md
  reusable_procedure: .agents/skills/codex-work-mode/SKILL.md
  local_reference: ops/docs/reference/codex_work_mode.md
  packet_template: ops/docs/handoffs/templates/codex_control_implementation.md
  current_snapshot: ops/docs/handoffs/codex_work_mode_current.md
routing:
  ordinary: Planning -> authoritative Control A/B -> one ephemeral Implementer
  cross_repository: Planning -> Strategy -> affected Planning
  strategy_message_conditions:
    - cross_repository_decision_affecting_another_planning_task
    - strategy_owned_lifecycle_action
    - changed_evidence_re_evaluates_registered_gate
  local_only_packet_misroute_response: Route this packet to the local Planning owner.
  local_status_terminal_packets_and_receipts_stay_planning_control: true
roles:
  planning: commits_accepted_plan_records_immutable_criteria_and_sends_directly_to_control
  control: records_immutable_packet_owns_repair_acceptance_and_local_integration
  implementer: edits_packet_owned_paths_runs_checks_and_returns_to_control
execution:
  planning_selects_implementation_details: false
  planning_receives_intermediate_repair_or_status: false
  planning_monitors_implementer: false
  control_keeps_at_most_one_ephemeral_implementer_active: true
  conformance_defect_within_unchanged_criteria_is_nonterminal_bounded_repair: true
  repair_packet_requires_attempt_evidence_direct_mechanism_and_checks: true
  planning_packet_before_terminal_outcome: false
  terminal_packet_is_immutable_and_direct: true
  terminal_packet_identifies_delivery_attempt_source_target_disposition_and_next_owner: true
  planning_paired_receipt: released_terminal_idle
  active_packet_none_requires_exact_missing_decision_and_owner: true
  committed_accepted_plan_authorizes_routine_local_execution: true
  control_authors_or_reopens_planning_documents: false
evidence:
  state_labels: [configured, documented, observed, unknown]
immutable_artifacts:
  generic_active_prose_freeze_allowed: false
  accepted_plan_committed: true
  criteria_and_control_packet_recorded_immutable: true
protected_validation:
  registered_immutable_policy_required: true
  required_policy_fields: [identity_version, repository_target_validator_command_worktree_commit, credential_injection_owner, safe_receipt_schema, side_effect_concurrency, nonce_replay, expiry_revocation, preconditions_postconditions, uncertain_outcome_fence]
  trusted_local_credential_bearing_validator_required: true
  validator_verifies_manifest_and_exact_one_use_match: true
  unavailable_result: protected_validator_unavailable
  human_output_is_follow_on_authority: false
allocation:
  strategy: gpt-5.6-sol/xhigh
  planning: gpt-5.6-sol/high
  control: gpt-5.6-terra/high
  normal_ephemeral_implementer: gpt-5.6-terra/medium
  deeper_ephemeral_implementer: explicit_immutable_packet_complexity_rationale_gpt-5.6-terra/high
  luna_ephemeral_implementer_allowed: false
  gpt_5_5_active_allocation_allowed: false
handoff:
  eligibility_before_model_selection: true
  persistent: exceptional_recorded_reason_one_packet_continuity
  certified_mechanical_after_eligibility: gpt-5.6-luna/medium
boundaries:
  controls_do_not_coordinate_cross_repository_architecture: true
  historical_records_are_preserved: true
  external_actions_require_explicit_authorization: true
